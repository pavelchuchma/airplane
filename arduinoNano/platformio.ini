; Arduino Nano V3 (CH340, ATmega328P) + MPU-6050
;
; CH340 clones usually ship with the old bootloader -> board "nanoatmega328",
; upload at 57600 baud. If upload fails with a sync/timeout error, try the
; new bootloader (Optiboot) instead: board = nanoatmega328new, upload_speed = 115200.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
monitor_speed = 115200
monitor_filters = time, colorize
