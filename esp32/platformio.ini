; ESP32 air/ground pair connected via ESP-NOW.
;
;   air    - in the airplane: sensors, servos, autopilot
;   ground - ESP-NOW <-> USB bridge for cocpitView
;
; Shared code (message structs, ESP-NOW wrapper) lives in lib/protocol/
; and is compiled into both environments.
;
; Build/upload: pio run -e air -t upload   (or -e ground)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
; Both boards have clone CP2102 bridges with the same serial number, so the
; port is selected by physical USB location (tools/select_port.py) — each
; board must stay in its assigned USB port. After replugging elsewhere,
; update custom_usb_location from `pio device list` (LOCATION= field).
extra_scripts = pre:tools/select_port.py

[env:air]
build_src_filter = +<air/>
build_flags = -DROLE_AIR
custom_usb_location = 2-1.2.3.3.2

[env:ground]
build_src_filter = +<ground/>
build_flags = -DROLE_GROUND
custom_usb_location = 2-1.2.3.2
