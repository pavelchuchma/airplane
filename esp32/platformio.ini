; ESP32 air/ground pair connected via ESP-NOW.
;
;   air    - in the airplane: sensors, servos, autopilot
;   ground - ESP-NOW <-> USB bridge for cocpitView
;
; Shared code (message structs, ESP-NOW wrapper) lives in lib/protocol/
; and is compiled into both environments.
;
; Build/upload: pio run -e air -t upload   (or -e ground)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
; Both boards have clone CP2102 bridges with the same USB serial number, so
; ports are resolved by the ESP32's factory MAC (tools/select_port.py probes
; candidate ports via the ROM bootloader). Boards may be plugged anywhere.
; custom_usb_location is just a hint deciding which port is probed first —
; keep it roughly current (`pio device list`) so the probe usually doesn't
; reset the other board.
extra_scripts = pre:tools/select_port.py

[env:air]
build_src_filter = +<air/>
build_flags = -DROLE_AIR
lib_deps = mikalhart/TinyGPSPlus@^1.1.0
custom_board_mac = 68:09:47:f6:b9:b0
custom_usb_location = 2-1.2.3.3.2

[env:ground]
build_src_filter = +<ground/>
build_flags = -DROLE_GROUND
custom_board_mac = 68:09:47:f7:3c:cc
custom_usb_location = 2-1.2.3.2
