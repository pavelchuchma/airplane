; ESP32 air/ground pair connected via ESP-NOW.
;
;   air    - in the airplane: sensors, servos, autopilot
;   ground - ESP-NOW <-> USB bridge for cocpitView
;
; Shared code (message structs, ESP-NOW wrapper) lives in lib/protocol/
; and is compiled into both environments.
;
; Build/upload: pio run -e air -t upload   (or -e ground)
;
; Secrets and site-specific values live in local.ini (git-ignored, see
; local.ini.example) and are merged in via extra_configs.

[platformio]
extra_configs = local.ini

[env]
; pioarduino = arduino-esp32 3.x on ESP-IDF 5.5 (the official espressif32
; platform stops at 2.0.17); pinned to an exact release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
; Both boards have clone CP2102 bridges with the same USB serial number, so
; ports are resolved by the ESP32's factory MAC (tools/select_port.py probes
; candidate ports via the ROM bootloader). Boards may be plugged anywhere.
; custom_usb_location is just a hint deciding which port is probed first —
; keep it roughly current (`pio device list`) so the probe usually doesn't
; reset the other board.
extra_scripts =
	pre:tools/select_port.py
	pre:tools/peer_mac.py
	pre:tools/link_keys.py

[env:air]
build_src_filter = +<air/>
; core logging off (pioarduino defaults it on): an [E] line blocks UART0
; for ~9 ms per failure, and on the ground board it would land in the
; binary frame stream.
build_flags = -DROLE_AIR -DCORE_DEBUG_LEVEL=0
lib_deps = mikalhart/TinyGPSPlus@^1.1.0
custom_board_mac = 68:09:47:f6:b9:b0
custom_usb_location = 0-1

[env:ground]
build_src_filter = +<ground/>
build_flags = -DROLE_GROUND -DCORE_DEBUG_LEVEL=0
; the ground UART carries framed binary telemetry, not text
monitor_speed = 460800
custom_board_mac = 68:09:47:f7:3c:cc
custom_usb_location = 2-1

; Bench test of the I2C driver's failure timing (doc/plans/2026-10-20-arduino3-native-i2c.md):
; times reads from an address nobody answers, through Wire and through
; i2cbus. Runs on any bare devkit - flashed onto the ground board by default.
[env:i2ctest]
build_src_filter = +<i2ctest/> +<air/i2cbus.cpp>
build_flags = -DCORE_DEBUG_LEVEL=0
custom_board_mac = 68:09:47:f7:3c:cc
custom_usb_location = 2-1

; The same test on the old core (arduino-esp32 2.0.17 / IDF 4.4), for
; comparison - Wire only, i2cbus needs IDF 5.
[env:i2ctest-core2]
extends = env:i2ctest
platform = espressif32@6.12.0
build_src_filter = +<i2ctest/>
